<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pensando en ti | Nuestro Contador</title>
  
  <!-- Tipografías elegantes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Montserrat:wght@300;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #240a35 0%, #0d0317 70%, #05010a 100%);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
      padding: 30px 15px;
    }

    /* Destellos y estrellas flotantes */
    .star-particle {
      position: absolute;
      bottom: -20px;
      color: rgba(255, 182, 217, 0.6);
      pointer-events: none;
      animation: floatUp 9s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.9; }
      100% {
        transform: translateY(-110vh) scale(1.4) rotate(360deg);
        opacity: 0;
      }
    }

    /* Tarjeta principal estilo Cristal Neón */
    .container {
      background: rgba(20, 10, 35, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 105, 180, 0.25);
      padding: 45px 35px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 42, 117, 0.25);
      text-align: center;
      max-width: 750px;
      width: 100%;
      z-index: 10;
      animation: fadeIn 1.8s ease;
    }

    /* Marco de Foto GRANDE y Resaltante */
    .photo-container {
      width: 320px;
      height: 320px;
      margin: 0 auto 25px auto;
      border-radius: 28px;
      padding: 6px;
      background: linear-gradient(135deg, #ff2a75, #9b51e0, #ff6097);
      box-shadow: 0 0 35px rgba(255, 42, 117, 0.7), 0 0 15px rgba(155, 81, 224, 0.5);
      position: relative;
      overflow: hidden;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
      transition: opacity 0.8s ease-in-out, transform 0.8s ease;
    }

    /* Frases dinámicas exclusivas */
    .photo-caption {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: #ffe0f0;
      min-height: 70px;
      margin-bottom: 30px;
      padding: 0 15px;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.7);
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }

    /* Título y subtítulo */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 42, 117, 0.8);
      text-transform: uppercase;
    }

    p.subtitle {
      color: #d1b3ff;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      margin-bottom: 35px;
      font-weight: 300;
    }

    /* Rejilla del contador de Lujo */
    .counter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 10px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 105, 180, 0.3);
      padding: 22px 10px;
      border-radius: 20px;
      box-shadow: inset 0 0 15px rgba(255, 42, 117, 0.1), 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 105, 180, 0.8);
    }

    .number {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 30%, #ff7bb0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      line-height: 1;
      margin-bottom: 8px;
    }

    .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #cbb4e6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Adaptación perfecta a pantallas móviles */
    @media (max-width: 600px) {
      .container { padding: 30px 18px; }
      .photo-container { width: 260px; height: 260px; }
      .photo-caption { font-size: 1.25rem; min-height: 60px; }
      h1 { font-size: 1.6rem; }
      .counter-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .number { font-size: 2.1rem; }
      .time-box { padding: 16px 8px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- MARCO DE FOTO MÁS GRANDE -->
    <div class="photo-container">
      <img id="slideshow" src="foto1.jpeg" alt="Nuestro recuerdo">
    </div>

    <!-- FRASE DEDICATORIA EN FUENTE ROMÁNTICA -->
    <div class="photo-caption" id="photo-text">Cargando amor...</div>

    <h1>Tiempo Separados ❤️</h1>
    <p class="subtitle">Desde aquel último abrazo el 14 de Mayo de 2026 a las 4:30 PM</p>

    <!-- CONTADOR DESTACADO -->
    <div class="counter-grid">
      <div class="time-box">
        <span class="number" id="days">0</span>
        <span class="label">Días</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">0</span>
        <span class="label">Horas</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">0</span>
        <span class="label">Minutos</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">0</span>
        <span class="label">Segundos</span>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // FOTOS Y FRASES PERSONALIZADAS (.jpeg)
    // -------------------------------------------------------------
    const gallery = [
      { 
        url: 'foto1.jpeg', 
        text: '"No sabía que sería la última vez que vería al amor de mi vida durante los próximos 5 meses"' 
      },
      { 
        url: 'foto2.jpeg', 
        text: '"Te amo con mi vida ❤️"' 
      },
      { 
        url: 'foto3.jpeg', 
        text: '"Cada día te extraño cachetona mía ✨"' 
      },
      { 
        url: 'foto4.jpeg', 
        text: '"Contando cada segundo en el calendario hasta volver a fundirnos en un abrazo 💖"' 
      },
      { 
        url: 'foto5.jpeg', 
        text: '"Aunque la distancia nos separe por ahora, mi corazón siempre late por ti 🌙"' 
      },
      { 
        url: 'foto6.jpeg', 
        text: '"Eres mi persona favorita en todo el universo entero ✨"' 
      }
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById('slideshow');
    const textElement = document.getElementById('photo-text');

    function updateSlide() {
      imgElement.style.opacity = 0;
      textElement.style.opacity = 0;

      setTimeout(() => {
        imgElement.src = gallery[currentIndex].url;
        textElement.innerText = gallery[currentIndex].text;
        imgElement.style.opacity = 1;
        textElement.style.opacity = 1;
      }, 400);

      currentIndex = (currentIndex + 1) % gallery.length;
    }

    updateSlide();
    setInterval(updateSlide, 4500);

    // -------------------------------------------------------------
    // CONTADOR EXACTO (14 de Mayo de 2026, 4:30 PM)
    // -------------------------------------------------------------
    const startDate = new Date(2026, 4, 14, 16, 30, 0);

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('days').innerText = days;
        document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
        document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
      }
    }

    setInterval(updateCounter, 1000);
    updateCounter();

    // Partículas y destellos de fondo
    function createStars() {
      const symbols = ['✨', '💖', '⭐', '💕', '✦'];
      for (let i = 0; i < 25; i++) {
        const star = document.createElement('div');
        star.classList.add('star-particle');
        star.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        star.style.left = Math.random() * 100 + 'vw';
        star.style.animationDuration = (Math.random() * 4 + 6) + 's';
        star.style.animationDelay = Math.random() * 5 + 's';
        star.style.fontSize = (Math.random() * 0.9 + 0.8) + 'rem';
        document.body.appendChild(star);
      }
    }

    createStars();
  </script>
</body>
</html>

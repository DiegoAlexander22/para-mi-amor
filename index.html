<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pensando en ti | Nuestro Contador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b0c2e 0%, #090314 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
      padding: 20px 0;
    }

    /* Fondo de corazones flotantes */
    .heart-particle {
      position: absolute;
      bottom: -20px;
      color: rgba(255, 105, 180, 0.5);
      font-size: 1.2rem;
      pointer-events: none;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-105vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* Tarjeta principal */
    .container {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 42, 117, 0.15);
      text-align: center;
      max-width: 650px;
      width: 90%;
      z-index: 10;
      animation: fadeIn 2s ease;
    }

    /* Marco de Foto con efecto resplandor */
    .photo-container {
      width: 220px;
      height: 220px;
      margin: 0 auto 15px auto;
      border-radius: 20px;
      padding: 4px;
      background: linear-gradient(135deg, #ff2a75, #9b51e0);
      box-shadow: 0 0 25px rgba(255, 42, 117, 0.6);
      position: relative;
      overflow: hidden;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      transition: opacity 0.8s ease-in-out;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 5px;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
    }

    p.subtitle {
      color: #d1b3ff;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 20px;
      font-style: italic;
    }

    /* Frases dinámicas por foto */
    .photo-caption {
      font-size: 1rem;
      color: #ffb3d1;
      min-height: 50px;
      margin-bottom: 25px;
      padding: 0 10px;
      font-style: italic;
      text-shadow: 0 0 10px rgba(255, 42, 117, 0.4);
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }

    /* Rejilla del contador */
    .counter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 105, 180, 0.2);
      padding: 14px 5px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ff6097;
      text-shadow: 0 0 12px rgba(255, 96, 151, 0.7);
      display: block;
      line-height: 1;
      margin-bottom: 5px;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #cbb4e6;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 500px) {
      .counter-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      h1 { font-size: 1.4rem; }
      .number { font-size: 1.5rem; }
      .photo-container { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- MARCO DE FOTO Y CARRUSEL -->
    <div class="photo-container">
      <img id="slideshow" src="foto1.jpg" alt="Nuestro recuerdo">
    </div>

    <!-- FRASE DEDICATORIA DINÁMICA -->
    <div class="photo-caption" id="photo-text">Cargando amor...</div>

    <h1>Tiempo Separados ❤️</h1>
    <p class="subtitle">Desde aquel último abrazo el 14 de Mayo de 2026 a las 4:30 PM</p>

    <div class="counter-grid">
      <div class="time-box">
        <span class="number" id="days">0</span>
        <span class="label">Días</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">0</span>
        <span class="label">Horas</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">0</span>
        <span class="label">Minutos</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">0</span>
        <span class="label">Segundos</span>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // FOTOS Y FRASES PERSONALIZADAS
    // -------------------------------------------------------------
    const gallery = [
      { 
        url: 'foto1.jpg', 
        text: '"No sabía que sería la última vez que vería al amor de mi vida durante los próximos 5 meses"' 
      },
      { 
        url: 'foto2.jpg', 
        text: '"Te amo con mi vida ❤️"' 
      },
      { 
        url: 'foto3.jpg', 
        text: '"Cada día te extraño cachetona mía ✨"' 
      },
      { 
        url: 'foto4.jpg', 
        text: '"Contando cada segundo en el calendario hasta volver a fundirnos en un abrazo 💖"' 
      },
      { 
        url: 'foto5.jpg', 
        text: '"Aunque la distancia nos separe por ahora, mi corazón siempre late por ti 🌙"' 
      }
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById('slideshow');
    const textElement = document.getElementById('photo-text');

    function updateSlide() {
      imgElement.style.opacity = 0;
      textElement.style.opacity = 0;

      setTimeout(() => {
        imgElement.src = gallery[currentIndex].url;
        textElement.innerText = gallery[currentIndex].text;
        imgElement.style.opacity = 1;
        textElement.style.opacity = 1;
      }, 400);

      currentIndex = (currentIndex + 1) % gallery.length;
    }

    // Inicializar primera foto y cambiar cada 4.5 segundos
    updateSlide();
    setInterval(updateSlide, 4500);

    // -------------------------------------------------------------
    // CONTADOR EXACTO (14 de Mayo de 2026, 4:30 PM)
    // Meses en JavaScript van de 0 a 11 (Mayo = 4)
    // -------------------------------------------------------------
    const startDate = new Date(2026, 4, 14, 16, 30, 0);

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById('days').innerText = days;
        document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
        document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
      }
    }

    // Corazones flotantes de fondo
    function createHearts() {
      const heartSymbols = ['❤️', '💖', '✨', '💕', '💗'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 1 + 0.8) + 'rem';
        document.body.appendChild(heart);
      }
    }

    setInterval(updateCounter, 1000);
    updateCounter();
    createHearts();
  </script>
</body>
</html>
